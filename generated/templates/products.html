{% extends "base.html" %}
{% block content %}
<h2>Products</h2>
<div class="cards">
    {% for product in products %}
    <div class="card">
        <h3>{{ product.name }}</h3>
        <p class="price">{{ product.price }}</p>
        <a href="{{ url_for('product_details', product_id=loop.index0) }}">Details</a>
        <a href="{{ url_for('delete_product', product_id=loop.index0) }}">Delete</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
