{% extends "base.html" %}
{% block title %}المنتجات{% endblock %}

{% block styles %}
<style>
    .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
        padding: 20px;
    }
    .product-card {
        background: #1D1D20;
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 16px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }
    .product-image {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 4px;
        background-color: #2a2a2e;
    }
    .product-info {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        margin-top: 12px;
    }
    .product-name {
        color: #fbfbff;
        font-size: 18px;
        margin: 0 0 8px 0;
    }
    .product-price {
        color: #17b26a;
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 12px;
    }
    .product-actions {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: space-between;
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid #2a2a2e;
    }
    .product-actions a {
        flex: 1;
        text-align: center;
        padding: 6px 4px;
        border-radius: 4px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        color: white;
        transition: opacity 0.2s;
    }
    .product-actions a:hover {
        opacity: 0.85;
    }
    .btn-detail { background: #007bff; }
    .btn-edit { background: #ff9800; }
    .btn-delete { background: #dc3545; }
</style>
{% endblock %}

{% block content %}
<div class="products-grid">
    {% for product in products %}
    <div class="product-card">
        <img src="{{ url_for('static', filename=product.image) if product.image.startswith('uploads/') else product.image }}" alt="{{ product.name }}" class="product-image"/>
        <div class="product-info">
            <h3 class="product-name">{{ product.name }}</h3>
            <p class="product-price">${{ product.price }}</p>

            <div class="product-actions">
                <a href="/product?id={{ product.id }}" class="btn-detail">التفاصيل</a>
                <a href="/edit/{{ product.id }}" class="btn-edit">تعديل</a>
                <a href="/delete?id={{ product.id }}" class="btn-delete">حذف</a>
            </div>
        </div>
    </div>
    {% else %}
    <p style="color: #909094; text-align: center; grid-column: 1 / -1;">لا يوجد منتجات حاليًا</p>
    {% endfor %}
</div>
{% endblock %}
