{% extends "base.html" %}

{% block title %}Add Product{% endblock %}

{% block styles %}
<style>
	.form-container {
		max-width: 600px;
		margin: 40px auto;
		padding: 24px;
		background: #1D1D20;
		border-radius: 8px;
	}
	.form-group {
		margin-bottom: 16px;
	}
	label {
		display: block;
		color: #909094;
		margin-bottom: 4px;
	}
	.form-input {
		width: 100%;
		padding: 8px 12px;
		background: #2a2a2e;
		color: #fbfbff;
		border: 1px solid #444;
		border-radius: 4px;
	}
	.btn {
		padding: 10px 24px;
		background: #17b26a;
		color: #fff;
		border: none;
		border-radius: 4px;
		cursor: pointer;
	}
</style>
{% endblock %}

{% block content %}
<div class="form-container">
	<h1>Add New Product</h1>
	<form action="/add" method="POST">
		<div class="form-group">
			<label for="name">Product Name</label>
			<input type="text" id="name" name="name" class="form-input" required />
		</div>
		<div class="form-group">
			<label for= "price">Price:</label>
			<input type="number" id="price" name="price" class="form-input" required />
		</div>
		<div class="form-group">
			<label for="image">Image URL</label>
			<input type="text" id="image" name="image" class="form-input" />
		</div>
		<div class="form-group">
			<label for= "details">Details:</label>
			<textarea id="details" name="details" class="form-input"></textarea>
		</div>
		<button type="submit" class="btn">Add Product</button>
	</form>
</div>
{% endblock %}
