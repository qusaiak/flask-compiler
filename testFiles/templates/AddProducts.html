{% extends "base.html" %}

{% block title %}Add Product{% endblock %}

{% block styles %}
<style>
	.form-container { max-width: 600px; margin: 40px auto; padding: 24px; background: #1D1D20; border-radius: 8px; }
	.form-group { margin-bottom: 16px; }
	label { display: block; color: #909094; margin-bottom: 4px; }
	.form-input { width: 100%; padding: 8px 12px; background: #2a2a2e; color: #fbfbff; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; }
	.btn { padding: 10px 24px; background: #17b26a; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
	<h1>Add New Product</h1>
	<form action="/add" method="POST" enctype="multipart/form-data" class="product-form">
		<div class="form-group">
			<label for="name">Product Name</label>
			<input type="text" id="name" name="name" class="form-input" required>
		</div>
		<div class="form-group">
			<label for="price">Price</label>
			<input type="number" step="any" id="price" name="price" class="form-input" required>
		</div>
		<div class="form-group">
			<label for="image_file">Product Image (from device)</label>
			<input type="file" id="image_file" name="image_file" accept="image/*" class="form-input">
		</div>
		<div class="form-group">
			<label for="details">Details</label>
			<textarea id="details" name="details" rows="4" class="form-input"></textarea>
		</div>
		<button type="submit" class="btn">Add Product</button>
	</form>
</div>
{% endblock %}
